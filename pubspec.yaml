name: mydiary_app
description: Steam Game Favorite with Firebase Auth and Firestore.
publish_to: 'none'
version: 6.0.0+6

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^6.10.0
  cupertino_icons: 1.0.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  http: ^1.2.2
  flutter_svg: ^2.3.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon.png
  adaptive_icon_background: '#007AFF'
  adaptive_icon_foreground: assets/icon.png
